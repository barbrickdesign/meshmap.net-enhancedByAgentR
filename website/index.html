<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#fff">
<meta name="description" content="A nearly live map of Meshtastic nodes seen by the official Meshtastic MQTT server">
<title>MeshMap - Meshtastic Node Map</title>
<link rel="preload" href="/nodes.json" as="fetch" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900">
<link rel="stylesheet" href="https://unpkg.com/font-awesome@4.7.0/css/font-awesome.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet-easybutton@2.4.0/src/easy-button.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet-search@4.0.0/dist/leaflet-search.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">

<link rel="manifest" href="/site.webmanifest">
<style>
  html, body {
    height: 100%;
  }
  body {
    margin: 0;
    padding: 0;
  }
  body.dark {
    filter: invert(1) hue-rotate(180deg) brightness(1.33);
  }
  body.dark .dark-hidden {
    display: none;
  }
  body:not(.dark) .dark-only {
    display: none;
  }
  #header {
    background-color: #fff;
    box-shadow: 0 0 4px 0 rgb(0 0 0 / 40%);
    color: #333;
    display: flex;
    align-items: center;
    gap: 1em;
    font-family: "Inter", sans-serif;
    font-size: 16px;
    line-height: 1.2;
    height: 40px;
    padding: 0 17px 0 15px;
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    z-index: 1000;
  }
  #header a {
    color: inherit;
    text-decoration: none;
  }
  #header a:hover {
    opacity: 0.7;
  }
  #header a img {
    display: block;
  }
  #header-spacer {
    flex-grow: 1;
  }
  #last-refresh {
    font-size: 12px;
    color: #888;
    white-space: nowrap;
  }
  #map {
    position: absolute;
    top: 40px;
    bottom: 0;
    left: 0;
    right: 0;
  }
  table {
    border-collapse: collapse;
  }
  table :is(th, td) {
    text-align: left;
    vertical-align: top;
  }
  table :is(th, td):nth-child(n+2) {
    padding-left: 1em;
  }
  .break {
    word-break: break-all;
  }
  .leaflet-tooltip, .leaflet-popup-content {
    font-family: "Inter", sans-serif;
    font-size: 12px;
  }
  .leaflet-popup-content .title {
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 3px;
  }
  .leaflet-popup-content table {
    margin-top: 1em;
  }
  .leaflet-right .leaflet-control-attribution {
    text-align: right;
  }
  body.dark .leaflet-shadow-pane {
    display: none;
  }
  body.dark :is(.leaflet-tooltip, .leaflet-popup-content-wrapper, .leaflet-popup-tip) {
    box-shadow: 0 0 4px 0 rgb(0 0 0 / 40%);
  }
  @media (hover: none) {
    .leaflet-tooltip-pane {
      display: none;
    }
  }
  /* Copy-ID button */
  .copy-id-btn {
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
    margin-left: 4px;
    color: inherit;
    font-size: 11px;
    opacity: 0.6;
    vertical-align: middle;
  }
  .copy-id-btn:hover {
    opacity: 1;
  }
  /* Stats / Filter panel */
  #stats-panel {
    position: absolute;
    top: 50px;
    right: 10px;
    width: 280px;
    max-height: calc(100vh - 70px);
    overflow-y: auto;
    background: #fff;
    border-radius: 6px;
    box-shadow: 0 2px 8px rgb(0 0 0 / 30%);
    z-index: 999;
    font-family: "Inter", sans-serif;
    font-size: 13px;
    color: #333;
    display: none;
  }
  #stats-panel.open {
    display: block;
  }
  #stats-panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px 6px;
    border-bottom: 1px solid #eee;
    font-weight: 600;
    font-size: 14px;
    position: sticky;
    top: 0;
    background: #fff;
    z-index: 1;
  }
  #stats-panel-close {
    background: none;
    border: none;
    font-size: 18px;
    cursor: pointer;
    line-height: 1;
    color: #666;
    padding: 0;
  }
  #stats-panel-close:hover {
    color: #000;
  }
  .stats-section {
    padding: 10px 14px;
    border-bottom: 1px solid #f0f0f0;
  }
  .stats-section:last-child {
    border-bottom: none;
  }
  .stats-section h4 {
    margin: 0 0 8px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #888;
    font-weight: 600;
  }
  .stats-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 4px;
  }
  .stats-row:last-child {
    margin-bottom: 0;
  }
  .stats-label {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .stats-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .stats-count {
    font-weight: 600;
    color: #555;
  }
  .filter-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 5px;
    cursor: pointer;
  }
  .filter-row:last-child {
    margin-bottom: 0;
  }
  .filter-row input[type="checkbox"] {
    cursor: pointer;
    width: 14px;
    height: 14px;
    flex-shrink: 0;
  }
  .filter-row label {
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    flex: 1;
  }
  #filter-all-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
    padding-bottom: 8px;
    border-bottom: 1px solid #eee;
  }
  /* Legend strip */
  #legend {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    font-size: 11px;
    font-family: "Inter", sans-serif;
    color: #555;
    align-items: center;
  }
  #legend span {
    display: flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
  }
  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    display: inline-block;
    flex-shrink: 0;
  }
</style>
<script>
  const toggleDark = () => {
    if (document.body.classList.toggle('dark')) {
      document.querySelector('meta[name="theme-color"]').content = '#000'
      window.localStorage.setItem('theme', 'dark')
      return true
    }
    document.querySelector('meta[name="theme-color"]').content = '#fff'
    window.localStorage.removeItem('theme')
    return false
  }
  if (window.localStorage.getItem('theme') === 'dark') {
    document.addEventListener('DOMContentLoaded', () => toggleDark())
  }
</script>
<div id="header">
  <div>
    <a href="https://meshmap.net/" title="A nearly live map of Meshtastic nodes seen by the official Meshtastic MQTT server">MeshMap</a>
  </div>
  <div id="header-spacer"></div>
  <div id="last-refresh" title="Time since last data refresh"></div>
  <div>
    <a href="#" onclick="toggleStatsPanel();return false;" title="Node statistics &amp; filters"><i class="fa fa-bar-chart fa-lg"></i></a>
  </div>
  <div>
    <a href="#" onclick="toggleDark();return false;" title="Toggle dark mode">
      <i class="fa fa-moon-o fa-lg dark-hidden"></i>
      <i class="fa fa-sun-o fa-lg dark-only"></i>
    </a>
  </div>
  <div>
    <a href="https://github.com/brianshea2/meshmap.net?tab=readme-ov-file#faqs" title="FAQs"><i class="fa fa-question-circle fa-lg"></i></a>
  </div>
  <div>
    <a href="https://github.com/brianshea2/meshmap.net" title="GitHub"><i class="fa fa-github fa-lg"></i></a>
  </div>
  <div>
    <a href="https://meshtastic.org/" title="Powered by Meshtastic">
      <img alt="Meshtastic" src="/m-pwrd_bw_noborder-min.svg" style="width:1.2em;height:1.2em;">
    </a>
  </div>

<!-- Stats & Filter Panel -->
<div id="stats-panel">
  <div id="stats-panel-header">
    <span>Stats &amp; Filters</span>
    <button id="stats-panel-close" onclick="toggleStatsPanel()" title="Close">&#x2715;</button>
  </div>
  <div class="stats-section">
    <h4>Summary</h4>
    <div id="stats-summary"></div>
  </div>
  <div class="stats-section">
    <h4>Filter by Role</h4>
    <div id="filter-all-row">
      <input type="checkbox" id="filter-all" checked onchange="toggleAllFilters(this.checked)">
      <label for="filter-all" style="font-weight:600;">Show all roles</label>
    </div>
    <div id="filter-roles"></div>
  </div>
  <div class="stats-section">
    <h4>By Role</h4>
    <div id="stats-roles"></div>
  </div>
  <div class="stats-section">
    <h4>Top Hardware Models</h4>
    <div id="stats-hardware"></div>
  </div>
  <div class="stats-section">
    <h4>Top Regions</h4>
    <div id="stats-regions"></div>
  </div>
</div>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-easybutton@2.4.0/src/easy-button.js"></script>
<script src="https://unpkg.com/leaflet-search@4.0.0/dist/leaflet-search.min.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
  let lastActiveNode
  let markersByNode = {}
  let nodesBySearchString = {}
  let lastData = null
  let lastFetchTime = null
  const updateInterval = 65000

  // Role color mapping
  const roleColors = {
    ROUTER:        '#1565c0',
    ROUTER_CLIENT: '#1976d2',
    REPEATER:      '#e65100',
    TRACKER:       '#6a1b9a',
    SENSOR:        '#00695c',
    TAK:           '#827717',
    LOST_AND_FOUND:'#b71c1c',
    CLIENT_MUTE:   '#546e7a',
    CLIENT_HIDDEN: '#546e7a',
    CLIENT:        '#2e7d32',
  }
  const defaultRoleColor = '#2e7d32'
  const roleColor = role => roleColors[role] ?? defaultRoleColor

  // All known roles for filter UI (ordered by significance)
  const knownRoles = [
    'ROUTER', 'ROUTER_CLIENT', 'REPEATER', 'CLIENT', 'CLIENT_MUTE',
    'CLIENT_HIDDEN', 'TRACKER', 'SENSOR', 'TAK', 'LOST_AND_FOUND',
  ]
  // Roles currently enabled (null means all enabled)
  let enabledRoles = null

  // Create a colored SVG circle marker icon
  const createIcon = (role, opacity) => {
    const color = roleColor(role)
    return L.divIcon({
      className: '',
      html: `<svg width="14" height="14" viewBox="0 0 14 14" xmlns="http://www.w3.org/2000/svg">
        <circle cx="7" cy="7" r="5.5" fill="${color}" fill-opacity="${Math.max(0.25, opacity)}" stroke="${color}" stroke-width="2" stroke-opacity="${Math.max(0.5, opacity)}"/>
      </svg>`,
      iconSize: [14, 14],
      iconAnchor: [7, 7],
      popupAnchor: [0, -9],
    })
  }

  // Toggle stats panel
  const toggleStatsPanel = () => {
    document.getElementById('stats-panel').classList.toggle('open')
  }

  // Toggle all role filters at once
  const toggleAllFilters = checked => {
    document.querySelectorAll('#filter-roles input[type=checkbox]').forEach(cb => {
      cb.checked = checked
    })
    enabledRoles = checked ? null : new Set()
    renderNodes(lastData)
  }

  // Handle individual role checkbox change
  const onRoleFilterChange = () => {
    const checked = new Set()
    document.querySelectorAll('#filter-roles input[type=checkbox]').forEach(cb => {
      if (cb.checked) checked.add(cb.dataset.role)
    })
    const allRoles = document.querySelectorAll('#filter-roles input[type=checkbox]').length
    enabledRoles = checked.size === allRoles ? null : checked
    document.getElementById('filter-all').checked = enabledRoles === null
    renderNodes(lastData)
  }

  // Build filter checkboxes for roles present in data
  const buildRoleFilters = data => {
    const presentRoles = new Set(Object.values(data).map(n => n.role).filter(Boolean))
    const ordered = [...knownRoles.filter(r => presentRoles.has(r)),
                     ...[...presentRoles].filter(r => !knownRoles.includes(r)).sort()]
    const container = document.getElementById('filter-roles')
    container.innerHTML = ''
    ordered.forEach(role => {
      const row = document.createElement('div')
      row.className = 'filter-row'
      const isEnabled = enabledRoles === null || enabledRoles.has(role)
      row.innerHTML = `
        <input type="checkbox" id="filter-role-${role}" data-role="${role}" ${isEnabled ? 'checked' : ''} onchange="onRoleFilterChange()">
        <label for="filter-role-${role}">
          <span class="stats-dot" style="background:${roleColor(role)}"></span>
          ${html(role)}
        </label>
      `
      container.appendChild(row)
    })
  }

  // Update stats panel content
  const updateStats = data => {
    if (!data) return
    const nodes = Object.values(data)
    const total = nodes.length
    const now = Date.now() / 1000
    const recent = nodes.filter(n => Math.max(...Object.values(n.seenBy)) > now - 3600).length

    // Summary
    document.getElementById('stats-summary').innerHTML = `
      <div class="stats-row"><span>Total nodes</span><span class="stats-count">${total.toLocaleString()}</span></div>
      <div class="stats-row"><span>Seen in last hour</span><span class="stats-count">${recent.toLocaleString()}</span></div>
    `
    // Role counts
    const roleCounts = {}
    nodes.forEach(n => { if (n.role) roleCounts[n.role] = (roleCounts[n.role] ?? 0) + 1 })
    const rolesEl = document.getElementById('stats-roles')
    rolesEl.innerHTML = Object.entries(roleCounts)
      .sort((a, b) => b[1] - a[1])
      .map(([role, count]) => `
        <div class="stats-row">
          <span class="stats-label"><span class="stats-dot" style="background:${roleColor(role)}"></span>${html(role)}</span>
          <span class="stats-count">${count.toLocaleString()}</span>
        </div>`
      ).join('')

    // Hardware counts (top 10)
    const hwCounts = {}
    nodes.forEach(n => { if (n.hwModel) hwCounts[n.hwModel] = (hwCounts[n.hwModel] ?? 0) + 1 })
    const hwEl = document.getElementById('stats-hardware')
    hwEl.innerHTML = Object.entries(hwCounts)
      .sort((a, b) => b[1] - a[1])
      .slice(0, 10)
      .map(([hw, count]) => `
        <div class="stats-row">
          <span>${html(hw)}</span>
          <span class="stats-count">${count.toLocaleString()}</span>
        </div>`
      ).join('')

    // Region counts (top 10)
    const regionCounts = {}
    nodes.forEach(n => { if (n.region) regionCounts[n.region] = (regionCounts[n.region] ?? 0) + 1 })
    const regionEl = document.getElementById('stats-regions')
    regionEl.innerHTML = Object.entries(regionCounts)
      .sort((a, b) => b[1] - a[1])
      .slice(0, 10)
      .map(([region, count]) => `
        <div class="stats-row">
          <span>${html(region)}</span>
          <span class="stats-count">${count.toLocaleString()}</span>
        </div>`
      ).join('')

    // Build role filters
    buildRoleFilters(data)
  }

  // Update last-refresh timestamp in header
  const updateRefreshDisplay = () => {
    if (!lastFetchTime) return
    const el = document.getElementById('last-refresh')
    const age = Math.floor((Date.now() - lastFetchTime) / 1000)
    if (age < 60) {
      el.textContent = 'Updated just now'
    } else {
      el.textContent = `Updated ${duration(age)} ago`
    }
  }

  // encodes html reserved characters and ascii control characters
  const html = str => str
    ?.replace(/[\x00-\x1F]/g, c => `\\x${c.charCodeAt(0).toString(16).toUpperCase().padStart(2, '0')}`)
    .replace(/["&<>]/g, c => `&#${c.charCodeAt(0)};`)
  // makes more human-readable time duration strings
  const duration = d => {
    let s = ''
    if (d > 86400) {
      s += `${Math.floor(d / 86400)}d `
      d %= 86400
    }
    if (d > 3600) {
      s += `${Math.floor(d / 3600)}h `
      d %= 3600
    }
    s += `${Math.floor(d / 60)}min`
    return s
  }
  const since = t => `${duration(Date.now() / 1000 - t)} ago`

  // Copy text to clipboard with visual feedback on the button
  const copyToClipboard = (text, btn) => {
    navigator.clipboard?.writeText(text).then(() => {
      const orig = btn.innerHTML
      btn.innerHTML = '<i class="fa fa-check"></i>'
      setTimeout(() => { btn.innerHTML = orig }, 1500)
    }).catch(() => {})
  }

  // init map
  const map = L.map('map', {
    center: window.localStorage.getItem('center')?.split(',') ?? [25, 0],
    zoom: window.localStorage.getItem('zoom') ?? 2,
    attributionControl: false,
    zoomControl: false,
    worldCopyJump: true,
  })
  // add tiles
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: 'Map tiles from <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    maxZoom: 17,
  }).addTo(map)
  // add marker group
  const markers = L.markerClusterGroup({
    maxClusterRadius: zoom => zoom < 3 ? 40 : 30,
  }).addTo(map)
  // add node details layer (precision rectangle, relation lines)
  const detailsLayer = L.layerGroup().addTo(map)
  map.on('click', () => detailsLayer.clearLayers())
  // add search control
  map.addControl(new L.Control.Search({
    layer: markers,
    propertyName: 'searchString',
    initial: false,
    position: 'topleft',
    marker: false,
    moveToLocation: (_, s) => showNode(nodesBySearchString[s]),
  }))
  // add zoom control
  L.control.zoom({position: 'topright'}).addTo(map)
  // add geolocation control
  L.easyButton({
    position: 'topright',
    states: [
      {
        stateName: 'geolocation-button',
        title: 'Center map to current IP geolocation',
        icon: 'fa-crosshairs fa-lg',
        onClick: () => {
          fetch('https://ipinfo.io/', {headers: {Accept: 'application/json'}})
            .then(r => r.json())
            .then(({loc}) => loc && map.flyTo(loc.split(','), 10))
            .catch(e => console.error('Failed to set location:', e))
        },
      },
    ],
  }).addTo(map)
  // add attribution control
  const attribution = L.control.attribution({position: 'bottomright', prefix: false}).addTo(map)
  // updates attribution with given count of nodes
  const updateNodeCount = count => attribution.setPrefix(`
    ${count.toLocaleString()} nodes from
    <a href="https://meshtastic.org/docs/software/integrations/mqtt/#public-mqtt-server">Meshtastic MQTT</a>
  `)
  // track and store map position
  map.on('moveend', () => {
    const center = map.getCenter()
    window.localStorage.setItem('center', [center.lat, center.lng].join(','))
  })
  map.on('zoomend', () => {
    window.localStorage.setItem('zoom', map.getZoom())
  })
  // generates html for a node link
  const nodeLink = (num, label) => `<a href="#${num}" onclick="showNode(${num});return false;">${html(label)}</a>`

  // renders markers from data (respects active role filters)
  const renderNodes = data => {
    if (!data) return
    const popupWasOpen = lastActiveNode && markersByNode[lastActiveNode]?.isPopupOpen()
    const detailsLayerWasPopulated = detailsLayer.getLayers().length > 0
    markersByNode = {}
    nodesBySearchString = {}
    markers.clearLayers()
    detailsLayer.clearLayers()
    let reactivate = () => {}
    const relationsByNode = {}
    Object.entries(data).forEach(([nodeNum, node]) => {
      const {
        longName, shortName, hwModel, role,
        fwVersion, region, modemPreset, hasDefaultCh, onlineLocalNodes,
        latitude, longitude, altitude, precision,
        batteryLevel, voltage, chUtil, airUtilTx, uptime,
        temperature, relativeHumidity, barometricPressure, lux,
        windDirection, windSpeed, windGust, radiation, rainfall1, rainfall24,
        neighbors, seenBy
      } = node

      // apply role filter
      if (enabledRoles !== null && !enabledRoles.has(role)) {
        return
      }

      const id = `!${Number(nodeNum).toString(16)}`
      const position = [latitude, longitude].map(x => x / 10000000)
      let precisionCorners
      if (precision && precision > 0 && precision < 32) {
        const [latLo, latHi] = [latitude & (0xffffffff << (32 - precision)), latitude | (0xffffffff >>> precision)].sort((a, b) => a - b)
        const [longLo, longHi] = [longitude & (0xffffffff << (32 - precision)), longitude | (0xffffffff >>> precision)].sort((a, b) => a - b)
        precisionCorners = [
          [latLo, longLo].map(x => x / 10000000),
          [latHi, longHi].map(x => x / 10000000)
        ]
      }
      const seenByNums = new Set(
        Object.keys(seenBy)
          .map(topic => topic.match(/\/!([0-9a-f]+)$/))
          .filter(match => match)
          .map(match => parseInt(match[1], 16))
      )
      relationsByNode[nodeNum] ??= {}
      seenByNums.forEach(seenByNum => {
        relationsByNode[seenByNum] ??= {}
        const relationObj = relationsByNode[nodeNum][seenByNum] ?? relationsByNode[seenByNum][nodeNum] ?? {}
        relationsByNode[nodeNum][seenByNum] = relationObj
        relationsByNode[seenByNum][nodeNum] = relationObj
        relationObj.mqtt = true
      })
      if (neighbors) {
        Object.keys(neighbors).forEach(neighborNum => {
          relationsByNode[neighborNum] ??= {}
          const relationObj = relationsByNode[nodeNum][neighborNum] ?? relationsByNode[neighborNum][nodeNum] ?? {}
          relationsByNode[nodeNum][neighborNum] = relationObj
          relationsByNode[neighborNum][nodeNum] = relationObj
          relationObj.neighbor = true
        })
      }
      const drawNodeDetails = () => {
        detailsLayer.clearLayers()
        // precision rectangle
        if (precisionCorners) {
          L.rectangle(precisionCorners, {color: '#ffa932'}).addTo(detailsLayer)
        }
        // relation lines
        Object.entries(relationsByNode[nodeNum]).forEach(([relatedNum, relationObj]) => {
          if (data[relatedNum] === undefined) {
            return
          }
          const relatedPosition = [data[relatedNum].latitude, data[relatedNum].longitude].map(x => x / 10000000)
          const relationContent = `
            <table><tbody>
            <tr><th>Related node</th><td>${nodeLink(relatedNum, `!${Number(relatedNum).toString(16)}`)}</td></tr>
            <tr><th>Relation type</th><td>${[relationObj.neighbor && 'Neighbor', relationObj.mqtt && 'MQTT uplink'].filter(v => v).join(', ')}</td></tr>
            <tr><th>Distance</th><td>${Math.round(map.distance(position, relatedPosition)).toLocaleString()} m</td></tr>
            ${neighbors?.[relatedNum]?.snr ? `<tr><th>SNR</th><td>${neighbors[relatedNum].snr} dB</td></tr>` : ''}
            </tbody></table>
          `
          L.polyline([position, relatedPosition])
            .bindTooltip(relationContent, {opacity: 0.95, sticky: true})
            .on('click', () => showNode(relatedNum))
            .addTo(detailsLayer)
        })
      }
      const lastSeen = Math.max(...Object.values(seenBy))
      const opacity = 1.0 - (Date.now() / 1000 - lastSeen) / 43200
      const tooltipContent = `${html(longName)} (${html(shortName)}) ${since(lastSeen)}`
      // unique element id for copy button
      const copyBtnId = `copy-btn-${nodeNum}`
      const popupContent = `
        <div class="title">${html(longName)} (${html(shortName)})</div>
        <div>
          ${nodeLink(nodeNum, id)}
          <button class="copy-id-btn" id="${copyBtnId}" title="Copy node ID" onclick="copyToClipboard('${html(id)}',document.getElementById('${copyBtnId}'))"><i class="fa fa-clipboard"></i></button>
          | ${html(role)} | ${html(hwModel)}
        </div>
        <table><tbody>
        ${uptime             ? `<tr><th>Uptime</th><td>${duration(uptime)}</td></tr>`                                : ''}
        ${batteryLevel       ? `<tr><th>Power</th><td>${batteryLevel > 100 ? 'Plugged in' : `${batteryLevel}%`}` +
                               `${voltage ? ` (${voltage.toFixed(2)}V)` : ''}</td></tr>`                             : ''}
        ${fwVersion          ? `<tr><th>Firmware</th><td>${html(fwVersion)}</td></tr>`                               : ''}
        ${region             ? `<tr><th>LoRa config</th><td>${html(region)} / ${html(modemPreset)}</td></tr>`        : ''}
        ${chUtil             ? `<tr><th>ChUtil</th><td>${chUtil.toFixed(2)}%</td></tr>`                              : ''}
        ${airUtilTx          ? `<tr><th>AirUtilTX</th><td>${airUtilTx.toFixed(2)}%</td></tr>`                        : ''}
        ${onlineLocalNodes   ? `<tr><th>Local nodes</th><td>${onlineLocalNodes}</td></tr>`                           : ''}
        ${precisionCorners   ? `<tr><th>Map precision</th><td>` +
                               `&#177;${Math.round(map.distance(...precisionCorners) / 2).toLocaleString()} m` +
                               ` (orange rectangle)</td></tr>`                                                       : ''}
        ${altitude           ? `<tr><th>Altitude</th><td>${altitude.toLocaleString()} m above MSL</td></tr>`         : ''}
        ${temperature        ? `<tr><th>Temperature</th><td>${temperature.toFixed(1)}&#8451; / ` +
                               `${(temperature * 1.8 + 32).toFixed(1)}&#8457;</td></tr>`                             : ''}
        ${relativeHumidity   ? `<tr><th>Relative humidity</th><td>${Math.round(relativeHumidity)}%</td></tr>`        : ''}
        ${barometricPressure ? `<tr><th>Barometric pressure</th><td>${Math.round(barometricPressure)} hPa</td></tr>` : ''}
        ${windDirection || windSpeed ? `<tr><th>Wind</th><td>` +
                                (windDirection ? `${windDirection}&#176;` : '') +
                                (windDirection && windSpeed ? ' @ ' : '') +
                                (windSpeed ? `${(windSpeed * 3.6).toFixed(1)}` : '') +
                                (windSpeed && windGust ? ` G ${(windGust * 3.6).toFixed(1)}` : '') +
                                (windSpeed ? ' km/h' : '') +
                                `</td></tr>`                                                                         : ''}
        ${lux                ? `<tr><th>Lux</th><td>${Math.round(lux)} lx</td></tr>`                                 : ''}
        ${radiation          ? `<tr><th>Radiation</th><td>${radiation.toFixed(2)} µR/h</td></tr>`                    : ''}
        ${rainfall1 || rainfall24 ? `<tr><th>Rainfall</th><td>` +
                                (rainfall1 ? `${rainfall1.toFixed(2)} mm/h` : '') +
                                (rainfall1 && rainfall24 ? ', ' : '') +
                                (rainfall24 ? `${rainfall24.toFixed(2)} mm/24h` : '') +
                                `</td></tr>`                                                                         : ''}
        </tbody></table>
        <table><thead>
        <tr><th>Last seen</th><th>via</th><th>MQTT root</th><th>channel</th></tr>
        </thead><tbody>
        ${Array.from(
          new Map(
            Object.entries(seenBy)
              .map(([topic, seen]) => (match => ({seen, via: match[3] ?? id, root: match[1], chan: match[2]}))(
                topic.match(/^(.*)(?:\/2\/e\/(.*)\/(![0-9a-f]+)|\/2\/map\/)$/s)
              ))
              .sort((a, b) => a.seen - b.seen)
              .map(v => [v.via, v])
          ).values(),
          ({seen, via, root, chan}) => `
            <tr>
            <td>${since(seen)}</td>
            <td>${chan ? ((n, l) => data[n] ? nodeLink(n, l) : l)(parseInt(via.slice(1), 16), via === id ? 'self' : via) : 'MapReport'}</td>
            <td class="break">${html(root)}</td>
            <td class="break">${html(chan ?? 'n/a')}</td>
            </tr>
          `
        ).reverse().join('')}
        </tbody></table>
      `
      const searchString = `${longName} (${shortName}) ${id}`
      nodesBySearchString[searchString] = nodeNum
      markersByNode[nodeNum] = L.marker(position, {
        alt: 'Node',
        opacity,
        searchString,
        icon: createIcon(role, opacity),
      })
        .bindTooltip(tooltipContent, {opacity: 0.95})
        .bindPopup(popupContent, {maxWidth: 600})
        .on('popupopen', () => {
          // set last active
          lastActiveNode = nodeNum
          // set URL fragment
          history.replaceState(null, '', `#${nodeNum}`)
          // draw precision rectangle, relation lines
          drawNodeDetails()
        })
      if (nodeNum === lastActiveNode) {
        if (popupWasOpen) {
          reactivate = () => {
            const cluster = markers.getVisibleParent(markersByNode[nodeNum])
            if (typeof cluster?.spiderfy === 'function') {
              cluster.spiderfy()
            }
            markersByNode[nodeNum].openPopup()
          }
        } else if (detailsLayerWasPopulated) {
          reactivate = drawNodeDetails
        }
      }
    })
    markers.addLayers(Object.values(markersByNode))
    reactivate()
  }

  // fetches node data, updates map, repeats
  const drawMap = async () => {
    try {
      const data = await fetch('/nodes.json').then(r => r.json())
      lastData = data
      lastFetchTime = Date.now()
      renderNodes(data)
      updateNodeCount(Object.keys(markersByNode).length)
      updateStats(data)
      updateRefreshDisplay()
    } catch (e) {
      console.error('Failed to update nodes:', e)
    }
    setTimeout(() => {
      if (document.hidden) {
        document.addEventListener('visibilitychange', drawMap, {once: true})
      } else {
        drawMap()
      }
    }, updateInterval)
  }
  // pans and zooms map to node and opens popup
  const showNode = nodeNum => {
    if (markersByNode[nodeNum] === undefined) {
      return false
    }
    map.panTo(markersByNode[nodeNum].getLatLng())
    setTimeout(() => {
      markers.zoomToShowLayer(markersByNode[nodeNum], () => {
        markersByNode[nodeNum].openPopup()
      })
    }, 300)
    return true
  }
  // keep URL fragment in sync
  window.addEventListener('hashchange', () => {
    if (window.location.hash && !showNode(window.location.hash.slice(1))) {
      history.replaceState(null, '', window.location.pathname)
    }
    if (!window.location.hash) {
      map.closePopup()
      detailsLayer.clearLayers()
    }
  })
  map.on('popupclose', () => {
    if (window.location.hash) {
      history.replaceState(null, '', window.location.pathname)
    }
  })
  // keep last-refresh display ticking
  setInterval(updateRefreshDisplay, 30000)
  // let's go!!!
  attribution.setPrefix('Loading node data&hellip;')
  drawMap().then(() => {
    if (window.location.hash && !showNode(window.location.hash.slice(1))) {
      history.replaceState(null, '', window.location.pathname)
    }
  })
</script>
